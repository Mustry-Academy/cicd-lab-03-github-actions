name: CI

# TODO (step 1): refine this trigger — add a `paths:` filter so docs-only PRs are
# skipped, plus a `push: branches: [main]` backstop. See the assignment.
on:
  pull_request:
    paths:
      - "projects/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/**"
      - ".yamllint.yml"
      - "rule_config.json"
    push:
      branches: [main]

# Least-privilege default; individual jobs override if they need more.
permissions:
  contents: read

jobs:
  # Job ids become the status-check names branch protection matches on —
  # keep `validate` and `lint` stable (renaming them orphans the required checks).

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project files
        # Gateway-free green/red signal: every project *.json is valid JSON and
        # every code.py parses as Python 3. The same check you run locally.
        run: scripts/validate.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tools
        run: pip install yamllint==1.35.1 ign-lint==0.6.1

      - name: yamllint
        run: yamllint -c .yamllint.yml .

      - name: actionlint
        uses: raven-actions/actionlint@v2

      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck scripts/*.sh

      - name: ignition-lint (Perspective views)
        run: ign-lint --config rule_config.json --files "projects/**/view.json"

      - name: docker compose config
        run: docker compose config -q
